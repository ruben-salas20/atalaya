[package]
name = "atalaya-server"
description = "Servicio de Atalaya: lee de Miniflux, traduce y lo entrega a las apps"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
atalaya-api.workspace = true
axum = "0.8.9"
chrono.workspace = true
feed-rs = "3.0.0"
isolang = { version = "2.4.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "query", "rustls"] }
serde.workspace = true
serde_json.workspace = true
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whatlang = "0.18.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
