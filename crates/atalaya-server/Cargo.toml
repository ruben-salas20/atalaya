[package]
name = "atalaya-server"
description = "Servicio de Atalaya: lee de Miniflux, traduce y lo entrega a las apps"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
atalaya-api.workspace = true
axum = "0.8.9"
chrono.workspace = true
hex = "0.4"
hmac = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "query", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whatlang = "0.18"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
