# Publica una versión de las apps en GitHub Releases (ADR 0012).
#
# - Al subir una etiqueta vX.Y.Z: compila el APK firmado y el binario del PC
#   y crea la Release, con las novedades del mensaje de la etiqueta.
#   Una etiqueta con sufijo (v0.2.0-prueba1) crea una versión de prueba, que
#   las apps no ven como la última.
# - A mano (workflow_dispatch) o en un PR que cambie este archivo: solo
#   compila, para probar el flujo. Los archivos quedan como artefactos de la
#   ejecución.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/publicar.yml"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Comprobar que la etiqueta coincide con Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=${GITHUB_REF_NAME#v}
            if [[ "${tag%%-*}" != "$version" ]]; then
              echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
              exit 1
            fi
            [[ "$tag" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: SDK de Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Compilar el APK firmado
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ATALAYA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            export ATALAYA_KEYSTORE="$RUNNER_TEMP/atalaya.jks"
            base64 -d <<< "$KEYSTORE_B64" > "$ATALAYA_KEYSTORE"
            apk=app-release.apk
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE: una versión publicada debe ir firmada"
            exit 1
          else
            echo "::warning::Sin el secreto ANDROID_KEYSTORE: el APK sale sin firmar"
            apk=app-release-unsigned.apk
          fi
          cd android
          ./gradlew assembleRelease testDebugUnitTest
          cp "app/build/outputs/apk/release/$apk" "$GITHUB_WORKSPACE/atalaya.apk"
          rm -f "$RUNNER_TEMP/atalaya.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: atalaya.apk

  pc:
    needs: version
    # Ubuntu 24.04 trae glibc 2.39: el binario funciona con esa o una más nueva.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas del sistema para GPUI
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar la app de PC
        run: |
          cargo build --release --locked -p atalaya-desktop
          cp target/release/atalaya-desktop atalaya-desktop-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: pc
          path: atalaya-desktop-linux-x86_64

  publicar:
    if: github.ref_type == 'tag'
    needs: [version, android, pc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout no trae el mensaje de una etiqueta anotada: se pide aparte.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > novedades.md
          sha256sum atalaya.apk atalaya-desktop-linux-x86_64 > SHA256SUMS
          flags=()
          [[ "${{ needs.version.outputs.prerelease }}" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" atalaya.apk atalaya-desktop-linux-x86_64 SHA256SUMS \
            --title "Atalaya ${{ needs.version.outputs.version }}" --notes-file novedades.md "${flags[@]}"
