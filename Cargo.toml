[workspace]
resolver = "3"
members = ["crates/atalaya-api", "crates/atalaya-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
atalaya-api = { path = "crates/atalaya-api" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
